on:
  push:
    # Run the scan on evey push in main
    branches: [main]
    # Run the scan evey day at 2:00pm
    schedule:
      - cron: '0 14 * * *'
    # To manually trigger scans from the GitHub UI
    workflow_dispatch:

env:
  LW_ACCOUNT: ${{ secrets.LW_ACCOUNT }}
  LW_SUBACCOUNT: ${{ secrets.LW_SUBACCOUNT }}
  LW_API_KEY: ${{ secrets.LW_API_KEY }}
  LW_API_SECRET: ${{ secrets.LW_API_SECRET }}

name: Lacework Code Security (Push)
jobs:
  run-analysis:
    runs-on: ubuntu-latest
    name: Run analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Analyze
        uses: lacework/code-security-action@v1
        with:
          target: push
